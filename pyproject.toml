[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkc-eus-delayrepay"
version = "0.2.0"
description = "Local MKC-EUS Delay Repay briefing tool"
requires-python = ">=3.11"

[project.scripts]
delayrepay = "delayrepay.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
