[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkc-eus-delayrepay"
version = "0.4.0"
description = "Local MKC-EUS Delay Repay tracker and private dashboard"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4",
    "waitress>=3.0,<4",
    "google-api-python-client>=2.180,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
]

[project.scripts]
delayrepay = "delayrepay.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"delayrepay.web" = ["templates/*.html", "static/*.css", "static/*.js"]
