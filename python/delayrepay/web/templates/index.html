<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delay Repay</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header>
    <div><p class="eyebrow">MKC ↔ EUS</p><h1>Disruptions</h1></div>
    <button id="refreshButton" class="secondary">Refresh</button>
  </header>
  <main>
    <section class="hero">
      <div><strong id="potentialCount">—</strong><span>Potential</span></div>
      <div><strong id="reviewCount">—</strong><span>Review</span></div>
      <div><strong id="claimedCount">—</strong><span>Claimed</span></div>
      <p id="rangeLabel">Loading…</p>
    </section>

    <details class="filter-panel">
      <summary><span>Filters</span><strong id="filterSummary">15+ min or cancelled</strong></summary>
      <section class="controls">
        <label>Period
          <select id="period"><option value="10">Last 10 days</option><option value="30">Last 30 days</option><option value="all">All stored</option><option value="custom">Custom dates</option></select>
        </label>
        <label id="fromWrap" hidden>From <input type="date" id="fromDate"></label>
        <label id="toWrap" hidden>To <input type="date" id="toDate"></label>
        <label>Direction <select id="direction"><option value="">All</option><option>MORNING</option><option>EVENING</option></select></label>
        <label>Operator <select id="operator"><option value="">All</option></select></label>
        <label>Status <select id="status"><option value="">All</option><option value="POTENTIAL">Potential</option><option value="NEEDS_REVIEW">Review</option><option value="CLAIMED">Claimed</option><option value="NO_CLAIM">No claim</option></select></label>
        <label>Delay <select id="delay"><option value="">All trains</option><option value="15" selected>15+ / cancelled</option><option value="30">30+ / cancelled</option><option value="60">60+ / cancelled</option></select></label>
      </section>
      <p class="incomplete"><span id="incompleteCount">—</span> incomplete collection days</p>
    </details>

    <div id="notice" class="notice" hidden></div>
    <section id="results" aria-live="polite"></section>
  </main>

  <dialog id="serviceDialog" class="service-dialog"><button class="dialog-close secondary" onclick="this.closest('dialog').close()">Close</button><div id="serviceDetail"></div></dialog>

  <dialog id="refreshDialog">
    <form method="dialog">
      <h2>Refresh the last 10 days?</h2>
      <div id="refreshPlan">Checking what is missing…</div>
      <div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button id="confirmRefresh" value="default">Refresh</button></div>
    </form>
  </dialog>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
